[tool.poetry]
name = "uptime-service"
version = "0.1.0"
authors = ["quilix11 <nazarus8095@gmail.com>"]


[project]
name = "uptime-service"
version = "0.1.0"
description = "Сервіс моніторингу аптайму"
authors = [
    {name = "quilix11", email = "nazarus8095@gmail.com"}
]
package-mode = false
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "redis (>=7.2.0,<8.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "taskiq (>=0.12.4,<0.13.0)",
    "taskiq-redis (>=1.2.2,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "libcst (>=1.8.6,<2.0.0)",
    "cst-lsp (>=0.1.3,<0.2.0)"
]
